name: Forge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Copy web client into Android assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www

          if [ -d .vercel/output/static ]; then
            cp -a .vercel/output/static/. app/src/main/assets/www/
          elif [ -d dist ]; then
            cp -a dist/. app/src/main/assets/www/
          elif [ -d .output/public ]; then
            cp -a .output/public/. app/src/main/assets/www/
          else
            echo "ERROR: no web build output found"
            find . -maxdepth 4 -type d \( -path './.vercel/output/static' -o -name dist -o -name public \) -print
            exit 1
          fi

          mkdir -p app/src/main/assets/www/assets
          client_js="$(find app/src/main/assets/www/assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)"
          client_css="$(find app/src/main/assets/www/assets -maxdepth 1 -type f -name '*.css' | head -n 1)"
          test -n "$client_js"

          # TanStack Start emits an SSR client bundle rather than a standalone index.html.
          # Create the minimal browser entry point for the Android WebView package.
          cat > app/src/main/assets/www/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>Forge</title>
              ${client_css:+<link rel="stylesheet" href="./assets/$(basename "$client_css")">}
            </head>
            <body>
              <script type="module" src="./assets/$(basename "$client_js")"></script>
            </body>
          </html>
          EOF

          # The client bundle was built for a web origin. Rewrite static asset URLs
          # so the bundled app can resolve them from android_asset/www.
          sed -i 's#"/assets/#"./assets/#g; s#`/assets/#`./assets/#g; s#"/__grok/#"./__grok/#g; s#`/__grok/#`./__grok/#g; s#"/favicon.svg"#"./favicon.svg"#g' "$client_js"
          test -s app/src/main/assets/www/index.html
          echo "Android client entry: $(basename "$client_js")"

      - name: Build debug APK with Gradle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
