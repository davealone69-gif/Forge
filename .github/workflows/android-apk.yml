name: Forge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Copy web build into Android assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          if [ -d dist ]; then
            cp -a dist/. app/src/main/assets/www/
          elif [ -d .output/public ]; then
            cp -a .output/public/. app/src/main/assets/www/
          else
            echo "ERROR: no web build output found"
            find . -maxdepth 2 -type d \( -name dist -o -name public \) -print
            exit 1
          fi
          test -s app/src/main/assets/www/index.html

      - name: Build debug APK with Gradle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
