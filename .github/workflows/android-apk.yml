name: Forge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test native app
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:test --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/tmp/apk-unzip-test.txt
          echo "APK verified: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
